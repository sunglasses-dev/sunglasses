name: Wrong block
description: Ordinary content that was blocked
title: "[wrong block] "
labels: ["detection"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for ordinary content that was blocked and should not have been.

        If something got past the scan, do not post it here and use the [private report](https://github.com/sunglasses-dev/sunglasses/security/advisories/new) instead, where we credit you in the release notes.
  - type: textarea
    id: input
    attributes:
      label: The exact input
      description: The file or string, as close to verbatim as you can share. Redact real secrets.
      render: text
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: The exact command you ran
      placeholder: sunglasses scan --file notes.pdf
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Exit code you expected
      description: "0 clean · 1 threat found · 2 usage/operational error · 3 incomplete inspection"
      placeholder: "0"
    validations:
      required: true
  - type: input
    id: actual
    attributes:
      label: Exit code you got
      placeholder: "1"
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version and environment
      description: "Output of `sunglasses --version` and `sunglasses check`."
      render: text
    validations:
      required: true
