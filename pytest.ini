# Pin what a bare `pytest` collects, so the suite count cannot depend on the
# invocation directory. 2026-08-28: two honest reviewers measured 780-passed and
# 778-passed on the SAME commit — the two customer-zero tests at repo root only
# collect when pytest is run from root scope. The gate's own count was ambiguous.
# Convention: reviewers run a bare `python3 -m pytest -q` from the repo root;
# an explicit path argument bypasses testpaths and re-creates the ambiguity.
[pytest]
testpaths =
    tests
    test_customer_zero.py

# `slow` marks the pathological-shape timing alarms. They assert that a document
# which matches nothing still fails fast, so they are real regression cover, but
# they are the only assertions in the suite whose result depends on how loaded
# the machine is. Registered so `-m "not slow"` is available to a runner that
# cannot promise a quiet CPU, and so an unknown-mark warning cannot hide a typo.
markers =
    slow: timing alarm on an adversarial input shape, sensitive to machine load
